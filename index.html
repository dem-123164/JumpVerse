<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>JumpVerse V3</title><style>
*{box-sizing:border-box}body{margin:0;background:#10152e;color:white;font-family:system-ui,Arial;overflow:hidden}canvas{display:block;width:100vw;height:100dvh;touch-action:none}.hud{position:fixed;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;pointer-events:none;font-weight:900;text-shadow:0 2px 5px #18213d}.panel{position:fixed;inset:0;background:linear-gradient(155deg,#1b2459ed,#512b88e8);display:flex;align-items:center;justify-content:center;padding:16px;overflow:auto}.box{width:min(540px,100%);background:#1a2351;border:3px solid #8b9cf9;border-radius:25px;padding:24px;text-align:center;box-shadow:0 15px 50px #090b22}.logo{font-size:clamp(34px,8vw,60px);margin:0;color:#ffe35d;text-shadow:3px 5px #d84a9d}.sub{color:#cbd7ff}.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:15px 0}button{cursor:pointer;border:0;border-radius:14px;background:#ffd24e;color:#1c2350;font-size:17px;font-weight:900;padding:13px 18px;box-shadow:0 5px #c68b24;touch-action:none}button:active{transform:translateY(3px);box-shadow:0 2px #c68b24}.secondary{background:#8eabff;box-shadow:0 5px #4d6bb8}.avatar{font-size:65px;display:block;margin:15px}.small{font-size:13px;color:#bac9ff}.hide{display:none!important}.controls{position:fixed;bottom:22px;left:20px;right:20px;display:flex;justify-content:space-between;pointer-events:none}.pad{width:125px;height:125px;border:3px solid #ffffff77;border-radius:50%;background:#17285c77;position:relative;pointer-events:auto;touch-action:none}.stick{width:56px;height:56px;border-radius:50%;background:#a5c5ff;position:absolute;left:32px;top:32px;box-shadow:0 4px 12px #0006}.actions{display:flex;gap:15px;align-items:flex-end;pointer-events:auto}.actions button{width:83px;height:83px;border-radius:50%;padding:5px;font-size:14px}.actions button:last-child{background:#80e8d3;box-shadow:0 5px #32a78e}.toast{position:fixed;top:58px;left:50%;transform:translateX(-50%);background:#18224bdc;padding:10px 20px;border-radius:15px;font-weight:800;pointer-events:none}.topbtn{position:fixed;top:50px;right:14px;pointer-events:auto;padding:8px 13px;font-size:13px}@media(min-width:900px){.controls{opacity:.75}}
</style></head><body><canvas id="game"></canvas><div id="hud" class="hud hide"><span id="stat">🏁 0%</span><span id="round">PARKUR 1/3</span><span id="timer">00:00</span></div><button id="pause" class="topbtn hide">⏸ Menü</button><div id="toast" class="toast hide"></div><div id="controls" class="controls hide"><div class="pad" id="pad"><div class="stick" id="stick"></div></div><div class="actions"><button id="jump">ZIPLA<br>↟</button><button id="slide">KAY<br>➜</button></div></div><div id="panel" class="panel"><div class="box" id="box"></div></div>
<script>
(()=>{'use strict';const c=document.querySelector('#game'),g=c.getContext('2d'),$=s=>document.querySelector(s),panel=$('#panel'),box=$('#box'),hud=$('#hud'),controls=$('#controls');let W=0,H=0,dpr=1,mode='menu',round=0,selected=0,coins=Number(localStorage.getItem('jv3coins')||0),unlocked=JSON.parse(localStorage.getItem('jv3skins')||'[0,1,2]'),time=0,last=0,toastEnd=0,finishX=4600,check=0,keys={},joy={x:0,y:0},obstacles=[],p={x:80,y:0,vx:0,vy:0,z:0,vz:0,jumps:0,slide:0},camera=0,particle=[];const names=['Kaptan','Panda','Robot','Tilki','Ninja','Astronot','Ejder','Korsan','Şövalye','Uzaylı','Penguen','Aslan'],faces=['🏴‍☠️','🐼','🤖','🦊','🥷','👩‍🚀','🐉','🦜','🛡️','👽','🐧','🦁'];const maps=[{name:'Gökkuşağı Yolu',sky:'#74c8ff',ground:'#54d49b',edge:'#358e85',hazard:'#ef618a'},{name:'Lav Vadisi',sky:'#fa9a73',ground:'#e7b565',edge:'#af654b',hazard:'#ff4228'},{name:'Buz Diyarı',sky:'#9ad7fa',ground:'#a2e5ee',edge:'#6ab4d8',hazard:'#4d7bc9'}];function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*dpr;c.height=H*dpr;g.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',resize);resize();function save(){localStorage.setItem('jv3coins',coins);localStorage.setItem('jv3skins',JSON.stringify(unlocked))}function show(html){panel.classList.remove('hide');box.innerHTML=html;hud.classList.add('hide');controls.classList.add('hide');$('#pause').classList.add('hide')}function menu(){mode='menu';show(`<h1 class="logo">JUMPVERSE</h1><h2>✨ V3 ✨</h2><span class="avatar">${faces[selected]}</span><p class="sub">${names[selected]} · 💎 ${coins} elmas</p><div class="row"><button id="play">🏁 YARIŞA BAŞLA</button><button class="secondary" id="skins">🎭 Karakterler</button></div><p class="small">3 farklı parkur · Çift zıplama · Kontrol noktaları</p><p class="small">Bilgisayar: WASD / ok tuşları, Boşluk, Shift. Telefon: sol yön, sağ zıpla/kay.</p>`);$('#play').onclick=()=>start(0);$('#skins').onclick=skins}function skins(){mode='skins';show(`<h2>🎭 Karakter Seç</h2><p>💎 ${coins} elmas · Yarış kazanarak 30 elmas topla</p><div class="row">${faces.map((f,i)=>`<button class="secondary" data-skin="${i}" title="${names[i]}">${f}<br><small>${unlocked.includes(i)?'Seç':'💎 60'}</small></button>`).join('')}</div><p class="small">Bu sürümde 12 karakter oynanabilir; 100 karakterlik koleksiyon sonraki sürümlerde genişletilecek.</p><button id="back">← Geri</button>`);box.querySelectorAll('[data-skin]').forEach(b=>b.onclick=()=>{let i=+b.dataset.skin;if(!unlocked.includes(i)){if(coins<60){toast('60 elmas gerekli!');return}coins-=60;unlocked.push(i)}selected=i;save();skins()});$('#back').onclick=menu}function toast(s){const t=$('#toast');t.textContent=s;t.classList.remove('hide');toastEnd=performance.now()+1800}function build(){obstacles=[];for(let x=520;x<finishX-300;x+=390){let n=Math.floor(x/390)%5;obstacles.push({x,type:n===0?'gap':n===1?'spinner':n===2?'block':n===3?'gap':'spinner',phase:x*.015});} }function start(r){round=r;mode='play';time=0;check=0;p={x:80,y:0,vx:0,vy:0,z:0,vz:0,jumps:0,slide:0};build();panel.classList.add('hide');hud.classList.remove('hide');controls.classList.remove('hide');$('#pause').classList.remove('hide');$('#round').textContent='PARKUR '+(round+1)+'/3';last=performance.now()}function gapAt(x){return obstacles.some(o=>o.type==='gap'&&x>o.x-65&&x<o.x+105)}function jump(){if(mode!=='play')return;if(p.jumps<2){p.vz=p.jumps?9.4:11.8;p.jumps++;p.slide=0}}function slide(){if(mode==='play')p.slide=.75}function reset(){p.x=check||80;p.y=0;p.z=0;p.vz=0;p.jumps=0;p.vx=0;p.vy=0;toast('💦 Kontrol noktasına döndün!')}function win(){mode='result';coins+=30;save();if(round<2){show(`<h1>🏁 Parkur Tamam!</h1><span class="avatar">${faces[selected]}</span><h2>${maps[round].name}</h2><p>⏱ ${time.toFixed(1)} saniye · 💎 +30</p><button id="next">SONRAKİ PARKUR ➜</button>`);$('#next').onclick=()=>start(round+1)}else{show(`<h1 class="logo">🏆 ŞAMPİYON!</h1><span class="avatar">${faces[selected]}</span><p>Üç parkuru da tamamladın!</p><p>💎 Toplam: ${coins}</p><button id="again">YENİDEN OYNA</button><button class="secondary" id="home">Ana Menü</button>`);$('#again').onclick=()=>start(0);$('#home').onclick=menu}}function rounded(x,y,w,h,r,color){g.fillStyle=color;g.beginPath();g.roundRect(x,y,w,h,r);g.fill()}function draw(){const m=maps[round];let horizon=H*.48,base=H*.72;g.fillStyle=m.sky;g.fillRect(0,0,W,H);g.fillStyle='#ffffff55';for(let i=0;i<12;i++){let x=((i*239-camera*.12)%(W+300)+W+300)%(W+300)-100;g.beginPath();g.ellipse(x,75+(i%4)*65,50,17,0,0,7);g.fill()}g.fillStyle=round===1?'#a94d55':'#6e9ecf';for(let i=0;i<12;i++){let x=((i*210-camera*.25)%(W+260)+W+260)%(W+260)-100;g.beginPath();g.moveTo(x,horizon+15);g.lineTo(x+110,horizon-100-(i%3)*20);g.lineTo(x+230,horizon+15);g.fill()}g.fillStyle=round===1?'#fc5a23':'#3684ce';g.fillRect(0,horizon,W,H-horizon);for(let i=0;i<30;i++){let x=((i*177-camera*.4)%(W+200)+W+200)%(W+200);g.fillStyle='#ffffff25';g.fillRect(x,horizon+35+i%6*35,50,3)}let scale=1,offset=W*.3-camera;let left=-offset-200,right=W-offset+200;g.fillStyle=m.edge;g.fillRect(0,base+75,W,H-base);g.fillStyle=m.ground;g.fillRect(0,base,W,80);for(let x=Math.floor(left/120)*120;x<right;x+=120){if(gapAt(x+60)){g.fillStyle=m.hazard;g.fillRect(x+offset,base,120,80);continue}g.fillStyle=x%240===0?'#ffffff18':'#0000000b';g.fillRect(x+offset,base,120,80);g.fillStyle='#ffffff35';g.fillRect(x+offset,base+6,3,65)}for(let o of obstacles){let sx=o.x+offset;if(sx<-170||sx>W+170)continue;if(o.type==='gap'){g.fillStyle=m.hazard;g.fillRect(sx-65,base,170,80);g.fillStyle='#fff5';for(let j=0;j<4;j++)g.fillRect(sx-55+j*40,base+25+Math.sin(time*3+j)*8,22,4)}if(o.type==='block'){rounded(sx-25,base-48,65,55,8,'#7549bd');rounded(sx-18,base-44,50,12,5,'#c5a0ff')}if(o.type==='spinner'){g.save();g.translate(sx,base-24);g.rotate(time*3+o.phase);rounded(-80,-12,160,24,12,'#ff5c87');g.fillStyle='#ffe9a0';g.beginPath();g.arc(0,0,18,0,7);g.fill();g.restore()}}for(let x=950;x<finishX;x+=1000){let sx=x+offset;g.fillStyle='#fff';g.fillRect(sx,base-100,9,100);g.fillStyle='#ffdc4c';g.fillRect(sx+9,base-100,54,32);g.fillStyle='#15234b';g.font='bold 15px system-ui';g.fillText('✓',sx+25,base-78)}let fx=finishX+offset;g.fillStyle='#fff';g.fillRect(fx,base-155,12,160);g.fillRect(fx+100,base-155,12,160);g.fillStyle='#232c55';g.fillRect(fx,base-155,112,36);g.fillStyle='#fff';g.font='bold 18px system-ui';g.fillText('FINISH',fx+15,base-130);let px=p.x+offset,py=base-28-p.z;g.fillStyle='#1118';g.beginPath();g.ellipse(px,base+4,25,7,0,0,7);g.fill();g.save();g.translate(px,py);if(p.slide>0)g.scale(1.25,.62);rounded(-20,-30,40,43,15,'#ffd44f');g.font='32px system-ui';g.textAlign='center';g.fillText(faces[selected],0,0);g.restore();g.textAlign='left';g.fillStyle='#fff';g.font='bold 14px system-ui';g.fillText(names[selected],px-20,py-45)}function update(dt){time+=dt;let move=Number(keys.ArrowRight||keys.KeyD)-Number(keys.ArrowLeft||keys.KeyA)+joy.x;move=Math.max(-1,Math.min(1,move));p.vx=move*(p.slide>0?460:290);let prev=p.x;p.x=Math.max(20,Math.min(finishX+120,p.x+p.vx*dt));p.slide=Math.max(0,p.slide-dt);p.vz-=25*dt;p.z+=p.vz*dt;if(p.z<=0){p.z=0;p.vz=0;p.jumps=0}if(p.z===0&&gapAt(p.x)){reset()}for(let o of obstacles){if(o.type==='gap'||Math.abs(o.x-p.x)>40||p.z>60)continue;if(o.type==='block'&&p.z<52||o.type==='spinner'&&p.z<40&&Math.abs(Math.sin(time*3+o.phase))>.35){reset();break}}for(let x=950;x<finishX;x+=1000)if(prev<x&&p.x>=x){check=x+80;toast('🚩 Kontrol noktası!')}if(p.x>=finishX)win();camera+=(p.x-W*.3-camera)*Math.min(1,dt*5);$('#stat').textContent='🏁 '+Math.min(100,Math.floor(p.x/finishX*100))+'%';let t=Math.floor(time);$('#timer').textContent=String(Math.floor(t/60)).padStart(2,'0')+':'+String(t%60).padStart(2,'0')}function frame(t){let dt=Math.min(.04,(t-last)/1000||0);last=t;if(mode==='play')update(dt);draw();if(toastEnd&&t>toastEnd){$('#toast').classList.add('hide');toastEnd=0}requestAnimationFrame(frame)}addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight','ArrowUp','Space','ShiftLeft','KeyA','KeyD','KeyW'].includes(e.code))e.preventDefault();keys[e.code]=true;if(e.code==='Space'||e.code==='ArrowUp'||e.code==='KeyW')if(!e.repeat)jump();if(e.code==='ShiftLeft')slide()});addEventListener('keyup',e=>keys[e.code]=false);$('#jump').addEventListener('pointerdown',e=>{e.preventDefault();jump()});$('#slide').addEventListener('pointerdown',e=>{e.preventDefault();slide()});const pad=$('#pad'),stick=$('#stick');function joyMove(e){let r=pad.getBoundingClientRect(),dx=e.clientX-(r.left+r.width/2),dy=e.clientY-(r.top+r.height/2),len=Math.hypot(dx,dy),s=Math.min(1,45/(len||1));joy.x=Math.max(-1,Math.min(1,dx/45));joy.y=dy/45;stick.style.transform=`translate(${dx*s}px,${dy*s}px)`}pad.addEventListener('pointerdown',e=>{pad.setPointerCapture(e.pointerId);joyMove(e)});pad.addEventListener('pointermove',e=>{if(pad.hasPointerCapture(e.pointerId))joyMove(e)});function joyEnd(){joy.x=0;joy.y=0;stick.style.transform=''}pad.addEventListener('pointerup',joyEnd);pad.addEventListener('pointercancel',joyEnd);$('#pause').onclick=()=>{mode='paused';show(`<h2>⏸ Oyun Duraklatıldı</h2><button id="resume">Devam Et</button><button class="secondary" id="exit">Ana Menü</button>`);$('#resume').onclick=()=>{mode='play';panel.classList.add('hide');hud.classList.remove('hide');controls.classList.remove('hide');$('#pause').classList.remove('hide')};$('#exit').onclick=menu};menu();requestAnimationFrame(frame)})();
</script></body></html>
