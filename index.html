<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>JumpVerse V2</title><style>
*{box-sizing:border-box}body{margin:0;overflow:hidden;font-family:system-ui,Arial;background:#76cfff;color:white;touch-action:none}canvas{display:block}button{border:0;color:white;font-weight:900;cursor:pointer;touch-action:none}#hud{position:fixed;top:8px;left:50%;transform:translateX(-50%);background:#211a50c9;border:2px solid #ffffff55;border-radius:18px;padding:7px 18px;text-align:center;z-index:4;min-width:220px;pointer-events:none}#hud b{color:#ffe65d;font-size:20px}#status{font-size:12px}#controls{position:fixed;inset:auto 0 12px;display:flex;justify-content:space-between;align-items:end;padding:0 20px;z-index:5;pointer-events:none}#stick{width:124px;height:124px;border-radius:50%;background:#322c70a8;border:3px solid #ffffff99;position:relative;pointer-events:auto;touch-action:none}#knob{position:absolute;left:36px;top:36px;width:46px;height:46px;border-radius:50%;background:#ffe768;border:3px solid white;box-shadow:0 3px 8px #0005;pointer-events:none}#actions{display:flex;gap:12px;align-items:end;pointer-events:auto}.action{width:76px;height:76px;border-radius:50%;font-size:16px;box-shadow:0 5px 0 #0004}#jump{background:#ee4d91}#slide{background:#24b9c9}#panel{position:fixed;inset:0;background:#19153bcf;z-index:8;display:flex;align-items:center;justify-content:center;padding:20px}#card{max-width:430px;width:100%;background:linear-gradient(150deg,#7249d9,#25215b);border:3px solid #ffffff55;border-radius:25px;text-align:center;padding:25px;box-shadow:0 15px 40px #0007}#card h1{font-size:36px;margin:5px;color:#ffe86c}#card p{line-height:1.6}#card button{padding:15px 24px;border-radius:15px;background:#ffb72c;color:#30234b;font-size:19px}#card small{display:block;margin-top:14px;opacity:.8}#help{position:fixed;right:10px;top:12px;z-index:6;background:#2a215cba;padding:7px;border-radius:9px;font-size:11px}@media(max-height:420px){#stick{width:100px;height:100px}#knob{left:27px;top:27px;width:40px;height:40px}.action{width:62px;height:62px;font-size:13px}#card{padding:10px}#card h1{font-size:25px}}
</style></head><body><div id="hud"><b>JUMPVERSE</b><div id="status">3 Turlu Parkur</div></div><div id="help">WASD / Oklar · Boşluk: çift zıpla · Shift: kay</div><div id="controls"><div id="stick"><div id="knob"></div></div><div id="actions"><button id="slide" class="action">KAY</button><button id="jump" class="action">ZIPLA</button></div></div><div id="panel"><div id="card"><h1>JUMPVERSE</h1><p>3 farklı parkurda yarış!<br>Joystick ile hareket et, iki kez zıpla, engellerin altından kay.<br><strong>Bu sürüm tek oyunculu bir denemedir.</strong></p><button id="start">OYNA</button><small>Gerçek çevrimiçi oyuncular ve eleme sistemi henüz eklenmedi.</small></div></div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js';
const scene=new THREE.Scene(),camera=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,.1,200),renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);document.body.appendChild(renderer.domElement);scene.add(new THREE.HemisphereLight(0xffffff,0x6562a0,2.3));const light=new THREE.DirectionalLight(0xffffff,2.5);light.position.set(-8,16,12);scene.add(light);
const world=new THREE.Group();scene.add(world);const mat=c=>new THREE.MeshStandardMaterial({color:c,roughness:.7});function box(w,h,d,c,x,y,z,parent=world){const o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat(c));o.position.set(x,y,z);parent.add(o);return o}function ball(r,c,x,y,z,parent=world){const o=new THREE.Mesh(new THREE.SphereGeometry(r,14,10),mat(c));o.position.set(x,y,z);parent.add(o);return o}
const player=new THREE.Group(),avatar=new THREE.Group();player.add(avatar);scene.add(player);const torso=new THREE.Mesh(new THREE.CapsuleGeometry(.38,.85,5,12),mat(0x8352f5));torso.position.y=.95;avatar.add(torso);for(const x of [-.15,.15]){ball(.095,0xffffff,x,1.31,-.34,avatar);ball(.045,0x171136,x,1.31,-.42,avatar)}for(const x of [-.22,.22])box(.23,.32,.3,0x342083,x,.22,0,avatar);
const maps=[{name:'Şeker Adası',floor:0x6be4b1,sky:0x8bdbff,ob:0xff688c,accent:0xffdc5a},{name:'Buz Vadisi',floor:0x9aeaff,sky:0xaddfff,ob:0x4b9ef7,accent:0xe8fbff},{name:'Lav Kalesi',floor:0x8b5aab,sky:0xfaa46b,ob:0xff663d,accent:0xffc83b},{name:'Gökkuşağı Yolu',floor:0xf3a5eb,sky:0x9ac6ff,ob:0x8e4de0,accent:0x6bffcc},{name:'Uzay Parkuru',floor:0x6b7ac8,sky:0x373567,ob:0xff70c5,accent:0x5ef5f2},{name:'Orman Koşusu',floor:0x72c870,sky:0xa1e7ed,ob:0x9b5f37,accent:0xffd15e}];let recent=[],chosen=[],round=0,active=false,finished=false,obstacles=[],checkpoints=[],checkpoint=3,vy=0,jumps=0,sliding=0,slideV=0,slideDir={x:0,z:-1},score=0,elapsed=0;const keys={},stick={x:0,z:0};const status=document.getElementById('status'),panel=document.getElementById('panel'),card=document.getElementById('card');
function chooseMaps(){let pool=maps.map((_,i)=>i),out=[];for(let k=0;k<3;k++){const opts=pool.filter(i=>!recent.includes(i));const candidates=opts.length?opts:pool;const i=candidates[Math.floor(Math.random()*candidates.length)];out.push(i);pool=pool.filter(v=>v!==i)}recent=[...out,...recent].slice(0,4);return out}
function resetPlayer(){player.position.set(0,0,checkpoint);vy=0;jumps=0;sliding=0;slideV=0;avatar.scale.y=1}
function makeMap(){world.clear();obstacles=[];checkpoints=[];checkpoint=3;const m=maps[chosen[round]];scene.background=new THREE.Color(m.sky);scene.fog=new THREE.Fog(m.sky,55,120);box(11,.8,91,m.floor,0,-.45,-37);for(let z=4;z>-80;z-=6){box(.3,.3,2,m.accent,-5.3,.12,z);box(.3,.3,2,m.accent,5.3,.12,z)}for(let i=0;i<10;i++){const z=-7-i*7;const x=[-2.6,0,2.6,0,-2.6,2.6,0,2.6,-2.6,0][i];if(i===3||i===7){const o=box(4.2,.7,1.1,m.ob,x,1.7,z);obstacles.push({o,type:'bar',w:2.1,d:.6})}else{const o=box(1.7,1.45,1.6,m.ob,x,.725,z);obstacles.push({o,type:'block',w:1.2,d:1.1})}ball(.33,m.accent,Math.sign(x||1)*4.3,.4,z)}for(const z of [-23,-51]){box(11,.12,.5,0x5effbf,0,.08,z);checkpoints.push(z)}box(11,.15,1,0xffe640,0,.1,-76);for(let i=0;i<18;i++){const z=2-i*4.5;ball(.5,i%2?m.accent:m.ob,-8,1,z);ball(.5,i%2?m.ob:m.accent,8,1,z)}resetPlayer();status.textContent=`Tur ${round+1}/3 · ${m.name} · Kontrol noktasına ulaş!`}
function show(title,desc,button,fn){active=false;panel.style.display='flex';card.innerHTML=`<h1>${title}</h1><p>${desc}</p><button id="go">${button}</button><small>JumpVerse V2 · Tek oyunculu prototip</small>`;document.getElementById('go').onclick=fn}
function startGame(){chosen=chooseMaps();round=0;score=0;elapsed=0;startRound()}
function startRound(){makeMap();panel.style.display='none';active=true;finished=false}
function finishRound(){if(finished)return;finished=true;score+=100+(round+1)*50;round++;if(round<3)show('TUR TAMAMLANDI! 🏁',`Harika! ${round}. parkuru bitirdin.<br>Toplam puan: ${score}<br>Sıradaki parkur: <b>${maps[chosen[round]].name}</b>`,'SONRAKİ TUR',startRound);else show('ŞAMPİYON! 🏆',`Üç farklı parkuru tamamladın!<br>Toplam puan: <b>${score}</b><br>Süre: ${Math.round(elapsed)} saniye<br>Deneyim: +${Math.round(score/2)} XP<br>Çok oyunculu yarışlar sonraki sürümlerde gelecek.`,'YENİDEN OYNA',startGame)}
function jump(){if(!active||jumps>=2)return;vy=jumps===0?9.2:8.1;jumps++;sliding=0;avatar.scale.y=1}
function slide(){if(!active||player.position.y>.05||sliding>0)return;const x=stick.x+(Number(!!(keys.KeyD||keys.ArrowRight))-Number(!!(keys.KeyA||keys.ArrowLeft))),z=stick.z+(Number(!!(keys.KeyS||keys.ArrowDown))-Number(!!(keys.KeyW||keys.ArrowUp)));const len=Math.hypot(x,z);slideDir={x:len?x/len:0,z:len?z/len:-1};slideV=len>0.15?10:3.8;sliding=len>0.15?.72:.42;avatar.scale.y=.53}
document.getElementById('start').onclick=startGame;document.getElementById('jump').addEventListener('pointerdown',e=>{e.preventDefault();jump()});document.getElementById('slide').addEventListener('pointerdown',e=>{e.preventDefault();slide()});addEventListener('keydown',e=>{if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code))e.preventDefault();if(!keys[e.code]&&e.code==='Space')jump();if(!keys[e.code]&&(e.code==='ShiftLeft'||e.code==='ShiftRight'))slide();keys[e.code]=true});addEventListener('keyup',e=>keys[e.code]=false);addEventListener('blur',()=>{Object.keys(keys).forEach(k=>keys[k]=false);stick.x=stick.z=0;knob.style.transform='translate(0,0)'});
const base=document.getElementById('stick'),knob=document.getElementById('knob');let pointer=null;function moveStick(e){const r=base.getBoundingClientRect(),dx=e.clientX-(r.left+r.width/2),dy=e.clientY-(r.top+r.height/2),max=r.width*.34,len=Math.hypot(dx,dy),scale=len>max?max/len:1;stick.x=dx*scale/max;stick.z=dy*scale/max;knob.style.transform=`translate(${dx*scale}px,${dy*scale}px)`}base.addEventListener('pointerdown',e=>{e.preventDefault();pointer=e.pointerId;base.setPointerCapture(pointer);moveStick(e)});base.addEventListener('pointermove',e=>{if(pointer===e.pointerId)moveStick(e)});function stopStick(e){if(pointer!==e.pointerId)return;pointer=null;stick.x=stick.z=0;knob.style.transform='translate(0,0)'}for(const ev of ['pointerup','pointercancel','lostpointercapture'])base.addEventListener(ev,stopStick);
let last=performance.now();function animate(now){requestAnimationFrame(animate);const dt=Math.min(.04,(now-last)/1000);last=now;if(active){elapsed+=dt;const dx=stick.x+Number(!!(keys.KeyD||keys.ArrowRight))-Number(!!(keys.KeyA||keys.ArrowLeft)),dz=stick.z+Number(!!(keys.KeyS||keys.ArrowDown))-Number(!!(keys.KeyW||keys.ArrowUp)),l=Math.hypot(dx,dz);if(sliding>0){player.position.x+=slideDir.x*slideV*dt;player.position.z+=slideDir.z*slideV*dt;sliding-=dt;if(sliding<=0)avatar.scale.y=1}else if(l>.1){player.position.x+=dx/l*7.3*dt;player.position.z+=dz/l*7.3*dt;player.rotation.y=Math.atan2(-dx/l,-dz/l)}vy-=23*dt;player.position.y+=vy*dt;if(player.position.y<=0){player.position.y=0;vy=0;jumps=0}for(const z of checkpoints){if(player.position.z<z&&checkpoint>z){checkpoint=z+1;status.textContent=`Tur ${round+1}/3 · ${maps[chosen[round]].name} · ✓ Kontrol noktası!`}}if(Math.abs(player.position.x)>5.1||player.position.z>5||player.position.y<-.5)resetPlayer();for(const {o,type,w,d} of obstacles){if(Math.abs(player.position.x-o.position.x)<w+.38&&Math.abs(player.position.z-o.position.z)<d+.35){if(type==='block'&&player.position.y<1.4||type==='bar'&&player.position.y<2.2&&!(sliding>0&&player.position.y<.05)){resetPlayer();break}}}if(player.position.z<-76)finishRound()}camera.position.lerp(new THREE.Vector3(player.position.x,player.position.y+5.5,player.position.z+10),.09);camera.lookAt(player.position.x,player.position.y+1,player.position.z-5);renderer.render(scene,camera)}requestAnimationFrame(animate);addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script></body></html>
